<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chatbot IMDS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f1f5f2;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 750px;
      background: white;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 15px rgba(0,0,0,0.15);
    }

    .header {
      background: #087f3f;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .header h1 {
      font-size: 22px;
    }

    .header p {
      font-size: 13px;
      margin-top: 5px;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #f7f9f7;
    }

    .message {
      max-width: 80%;
      padding: 11px 14px;
      margin-bottom: 10px;
      border-radius: 15px;
      line-height: 1.4;
      font-size: 15px;
    }

    .bot {
      background: #e3eee7;
      color: #173b27;
      border-bottom-left-radius: 4px;
    }

    .user {
      background: #087f3f;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 22px;
      padding: 12px 15px;
      font-size: 15px;
      outline: none;
    }

    #sendButton {
      border: none;
      background: #087f3f;
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }

    #sendButton:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <div class="chat">

    <div class="header">
      <h1>🤖 Chatbot IMDS</h1>
      <p>Institution Mixte Le Domaine du Savoir</p>
    </div>

    <div class="messages" id="messages">

      <div class="message bot">
        Bonjour ! 👋 Je suis le chatbot de l'IMDS.
        Comment puis-je vous aider ?
      </div>

    </div>

    <div class="input-area">
      <input
        type="text"
        id="messageInput"
        placeholder="Écrivez votre message..."
      >

      <button id="sendButton">➤</button>
    </div>

  </div>

  <script>

    const input = document.getElementById("messageInput");
    const button = document.getElementById("sendButton");
    const messages = document.getElementById("messages");

    function ajouterMessage(texte, type) {

      const message = document.createElement("div");

      message.className = "message " + type;

      message.textContent = texte;

      messages.appendChild(message);

      messages.scrollTop = messages.scrollHeight;
    }


    function repondre(message) {

      const texte = message.toLowerCase().trim();

      if (texte.includes("bonjour") ||
          texte.includes("salut") ||
          texte.includes("hello")) {

        return "Bonjour ! 👋 Heureux de vous accueillir à l'IMDS.";

      }

      if (texte.includes("nom")) {

        return "Je suis le chatbot de l'Institution Mixte Le Domaine du Savoir. 🤖";

      }

      if (texte.includes("classe") ||
          texte.includes("classes")) {

        return "L'IMDS comprend les trois niveaux de Kindergarten ainsi que les classes de 1re AF à 9e AF.";

      }

      if (texte.includes("adresse") ||
          texte.includes("où") ||
          texte.includes("situe")) {

        return "L'IMDS se trouve à Route Nationale No 1, Canaan 2, Nan kafou bò Aliks la.";

      }

      if (texte.includes("inscription") ||
          texte.includes("inscrire")) {

        return "Pour connaître les conditions et les frais d'inscription, veuillez contacter l'administration de l'IMDS.";

      }

      if (texte.includes("merci")) {

        return "Avec plaisir ! 😊";

      }

      if (texte.includes("au revoir") ||
          texte.includes("bye")) {

        return "Au revoir ! 👋 À bientôt à l'IMDS.";

      }

      return "Je suis encore en cours d'apprentissage 🤖. Essayez une question sur l'IMDS, les classes ou l'inscription.";
    }


    function envoyerMessage() {

      const texte = input.value.trim();

      if (texte === "") {
        return;
      }

      ajouterMessage(texte, "user");

      input.value = "";

      setTimeout(function() {

        const reponse = repondre(texte);

        ajouterMessage(reponse, "bot");

      }, 500);
    }


    button.addEventListener("click", envoyerMessage);


    input.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {

        envoyerMessage();

      }

    });

  </script>

</body>
</html>
