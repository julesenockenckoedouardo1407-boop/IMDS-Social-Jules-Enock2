<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b45"><link rel="manifest" href="manifest.json"><title>IMDS Social Jules Enock1</title><style>:root{--g:#176b45;--gold:#d4af37}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#eef7f1,#fff);color:#18352a;min-height:100vh}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:480px;background:#fff;border-radius:24px;padding:34px 24px;box-shadow:0 12px 35px #0002;text-align:center;border-top:6px solid var(--gold)}.logo{width:100px;height:100px;border-radius:50%;margin:5px auto 18px;background:var(--g);border:4px solid var(--gold)}h1{margin:0;color:var(--g);font-size:28px;line-height:1.15}.sub{font-weight:600;line-height:1.45}.school{color:#596b62;line-height:1.45}.buttons{display:grid;gap:13px;margin:24px 0}button{border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:700}.login{background:var(--g);color:#fff}.signup{background:#fff;color:var(--g);border:2px solid var(--g)}.back{background:#eee;color:#333;margin-top:10px}.hidden{display:none}.title{font-size:23px;font-weight:700;margin-bottom:15px}form{display:grid;gap:12px;text-align:left}label{font-size:13px;font-weight:700}input,select{width:100%;padding:13px;border:1px solid #ccd8d1;border-radius:10px;font-size:15px}.tag{color:#806a19;font-weight:700;margin-top:18px}.address{font-size:13px;color:#66756e;margin-top:10px}</style></head><body><div class="wrap"><section class="card"><div id="home"><div class="logo"></div><h1>IMDS SOCIAL<br>JULES ENOCK1</h1><p class="sub">Le réseau social privé de l’Institution Mixte Le Domaine du Savoir</p><p class="school">Un espace pour connecter la Direction, les professeurs, les élèves et les parents.</p><div class="buttons"><button class="login" onclick="show('login')">🔐 Se connecter</button><button class="signup" onclick="show('signup')">📝 Créer un compte</button></div><div class="tag">Excellence • Discipline • Réussite</div><div class="address">📍 Route Nationale No 1, Canaan 2</div></div><div id="login" class="hidden"><div class="title">🔐 Se connecter</div><form onsubmit="return msg('Connexion')"><label>Email ou téléphone<input required></label><label>Mot de passe<input type="password" required></label><button class="login">Se connecter</button></form><button class="back" onclick="show('home')">← Retour</button></div><div id="signup" class="hidden"><div class="title">📝 Créer un compte</div><form onsubmit="return msg('Création du compte')"><label>Prénom<input required></label><label>Nom<input required></label><label>Téléphone<input required></label><label>Email<input type="email" required></label><label>Type de compte<select required><option value="">Choisir...</option><option>Direction</option><option>Professeur</option><option>Élève</option><option>Parent</option></select></label><label>Mot de passe<input type="password" required></label><label>Confirmer mot de passe<input type="password" required></label><button class="login">Créer mon compte</button></form><button class="back" onclick="show('home')">← Retour</button></div></section></div><script>function show(id){['home','login','signup'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}function msg(x){alert(x+' : interface prête.');return false}</script></body></html>
