<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08783f"><title>IMDS Social Jules Enock</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f7f4;color:#173b2a}header{background:#08783f;color:white;text-align:center;padding:26px 15px}main{max-width:560px;margin:20px auto;padding:0 15px}.card{background:white;padding:22px;border-radius:18px;margin-bottom:16px;box-shadow:0 4px 15px #0001}h2{color:#08783f}label{display:block;font-weight:bold;margin:12px 0 5px}input,select{width:100%;padding:12px;border:1px solid #ccd8d0;border-radius:10px;font-size:16px}button{width:100%;padding:13px;border:0;border-radius:10px;margin-top:12px;font-size:16px;font-weight:bold}.p{background:#08783f;color:white}.g{background:#d5a526;color:white}.l{background:#e9f2ec;color:#08783f}.hidden{display:none}.ok{color:#08783f;font-weight:bold}.err{color:#b3261e;font-weight:bold}.extra{background:#f0f7f2;padding:10px;border-radius:10px;margin-top:12px}</style></head>
<body><header><h1>IMDS Social Jules Enock</h1><p>Institution Mixte Le Domaine du Savoir</p></header><main>
<section id="home" class="card"><h2>Bienvenue 👋</h2><p>Le réseau social privé de l'IMDS.</p><button class="p" onclick="show('login')">🔐 Se connecter</button><button class="g" onclick="show('register')">📝 Créer un compte</button></section>
<section id="register" class="card hidden"><h2>📝 Créer un compte</h2><div id="rm"></div><label>Type de compte</label><select id="role" onchange="fields()"><option value="">Choisir...</option><option>Direction</option><option>Professeur</option><option>Élève</option><option>Parent</option></select><label>Prénom</label><input id="first"><label>Nom</label><input id="last"><label>Téléphone</label><input id="phone"><label>Email</label><input id="email" type="email"><div id="extra" class="extra hidden"></div><label>Mot de passe</label><input id="pass" type="password"><label>Confirmer</label><input id="pass2" type="password"><button class="p" onclick="register()">Créer mon compte</button><button class="l" onclick="show('home')">Retour</button></section>
<section id="login" class="card hidden"><h2>🔐 Se connecter</h2><div id="lm"></div><label>Email ou téléphone</label><input id="lid"><label>Mot de passe</label><input id="lp" type="password"><button class="p" onclick="login()">Se connecter</button><button class="l" onclick="show('home')">Retour</button></section>
<section id="dash" class="card hidden"><h2>👋 Bienvenue <span id="wn"></span></h2><p id="wi"></p><button class="p" onclick="logout()">🚪 Se déconnecter</button></section>
</main>
<script>
const classes=["Kindergarten 1","Kindergarten 2","Kindergarten 3","1ère AF","2e AF","3e AF","4e AF","5e AF","6e AF","7e AF","8e AF","9e AF"];
function show(id){["home","register","login","dash"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id))}
function v(id){return (document.getElementById(id)?.value||"").trim()}
function fields(){let r=v("role"),e=document.getElementById("extra");e.innerHTML="";e.classList.toggle("hidden",!r);
if(r==="Élève")e.innerHTML='<label>Classe</label><select id="class">'+classes.map(x=>"<option>"+x+"</option>").join("")+'</select><label>Parent/tuteur</label><input id="parent"><label>Téléphone du parent</label><input id="parentPhone">';
if(r==="Professeur")e.innerHTML='<label>Matières</label><input id="subjects" placeholder="Ex. Français, Mathématiques"><label>Classes</label><input id="teacherClasses">';
if(r==="Parent")e.innerHTML='<label>Nom de l’enfant</label><input id="child"><label>Classe de l’enfant</label><select id="childClass">'+classes.map(x=>"<option>"+x+"</option>").join("")+"</select>";
if(r==="Direction")e.innerHTML='<label>Fonction</label><input id="function" placeholder="Ex. Directeur fondateur"><label>Code administrateur</label><input id="adminCode" type="password">'}
function register(){let r=v("role"),f=v("first"),l=v("last"),ph=v("phone"),em=v("email").toLowerCase(),p=v("pass");if(!r||!f||!l||!ph||!em||!p)return msg("rm","Remplissez les champs obligatoires.","err");if(p!==v("pass2"))return msg("rm","Les mots de passe ne correspondent pas.","err");let us=JSON.parse(localStorage.getItem("imdsUsers")||"[]");if(us.some(u=>u.email===em||u.phone===ph))return msg("rm","Email ou téléphone déjà utilisé.","err");let u={role,first:f,last:l,phone:ph,email:em,password:p,extra:{}};["class","parent","parentPhone","subjects","teacherClasses","child","childClass","function","adminCode"].forEach(k=>{if(v(k))u.extra[k]=v(k)});us.push(u);localStorage.setItem("imdsUsers",JSON.stringify(us));msg("rm","Compte créé avec succès. Connectez-vous.","ok");setTimeout(()=>show("login"),800)}
function login(){let id=v("lid").toLowerCase(),p=v("lp"),us=JSON.parse(localStorage.getItem("imdsUsers")||"[]"),u=us.find(x=>(x.email===id||x.phone===id)&&x.password===p);if(!u)return msg("lm","Identifiants incorrects.","err");localStorage.setItem("imdsSession",JSON.stringify(u));document.getElementById("wn").textContent=u.first+" "+u.last;document.getElementById("wi").textContent="Compte : "+u.role+" • "+u.email;show("dash")}
function logout(){localStorage.removeItem("imdsSession");show("home")}function msg(id,t,c){document.getElementById(id).innerHTML='<p class="'+c+'">'+t+"</p>"}
</script></body></html>
