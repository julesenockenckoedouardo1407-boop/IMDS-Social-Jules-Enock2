<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot IMDS</title>
<style>
body{font-family:Arial,sans-serif;background:#e8f5e9;margin:0;padding:0}
.chat{width:90%;max-width:430px;margin:30px auto;background:white;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.15);overflow:hidden;max-height:750px}
.header{background:#087f3f;color:white;padding:15px;text-align:center}.header h2{margin:0}.header p{margin:5px 0 0;font-size:13px}
#messages{height:560px;overflow-y:auto;padding:15px;background:#f7fff8}
.message{margin-bottom:10px;padding:10px 12px;border-radius:10px;max-width:85%;white-space:pre-line}
.bot{background:#d9f2df;color:#173b25}.user{background:#087f3f;color:white;margin-left:auto}
.input-area{display:flex;padding:10px;border-top:1px solid #ddd}
input{flex:1;padding:12px;border:1px solid #ccc;border-radius:20px;outline:none}
button{width:45px;height:45px;margin-left:8px;border:none;border-radius:50%;background:#087f3f;color:white;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div class="chat">
<div class="header"><h2>🤖 Chatbot IMDS</h2><p>Institution Mixte Le Domaine du Savoir</p></div>
<div id="messages"><div class="message bot">Bonjour 👋<br>Je suis le chatbot de l'IMDS. Comment puis-je vous aider ?</div></div>
<div class="input-area"><input type="text" id="userInput" placeholder="Écrivez votre question..."><button onclick="envoyerMessage()">➤</button></div>
</div>

<script>
const KB={
nom:"Institution Mixte Le Domaine du Savoir (IMDS)",
devise:"« Avec le domaine du savoir c'est l'éducation pour l'avenir. »",
fondation:"15 octobre 2015",
localisation:"Canaan 2, dans la commune de la Croix-des-Bouquets.",
niveaux:"Kindergarten et de la 1re à la 9e année fondamentale.",
contacts:["WhatsApp : +509 32562875","Appel direct : +509 4040-9680","Téléphone du directeur fondateur : +509 41139669"],
inscription:{
frais:"1 000 gourdes",horaires:"du lundi au vendredi, de 8h00 AM à 2h00 PM",
documents:["original et copie de l'acte de naissance","original et copie du bulletin scolaire","deux photos d'identité récentes","CIN de la personne responsable","carte de vaccination pour le Kindergarten"]},
frais:{kindergarten:"15 000 gourdes par classe","1re-6e":"12 500 gourdes","7e-8e":"14 000 gourdes","9e":"16 000 gourdes"},
horaires:{kindergarten:"lundi à vendredi, de 8h00 à 12h00","1re-6e":"lundi à vendredi, de 8h00 à 13h00","7e-9e":"lundi à vendredi, de 8h00 à 15h00"},
personnel:["Sainçois Leonel — directeur fondateur","Garbin Jean Baptiste — directeur adjoint","A. Jameson — directeur pédagogique","Jules Enock — professeur de français, sciences sociales et éducation à la citoyenneté pour la 7e–9e AF","Philisma Vectanise — enseignante de 1re–2e AF"],
eleves:["Bellabe Adssa Twesy","Antoine Luther","Renard Slancard","Renard Louibenson","Fils Aimé Wood","Lundi Bedou","François Peterson","Chery Yann Kolosky Steven","Angelo Pierre"],
promotion9e:["Sylvain Wilgensia","Eliézer Calubentchi","Pierre Bethina","Atika Laurassaint"]
};

function n(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g,"'").replace(/[^\w\s'-]/g," ").replace(/\s+/g," ").trim()}
function a(t,...m){return m.some(x=>t.includes(n(x)))}
function ajouterMessage(x,type){const b=document.getElementById("messages"),d=document.createElement("div");d.className="message "+type;d.textContent=x;b.appendChild(d);b.scrollTop=b.scrollHeight}

function repondre(message){
const t=n(message);

if(a(t,"bonjour","bonsoir","salut","hello","coucou","bon matin","bonne journee"))return"Bonjour 👋 Bienvenue à l'IMDS. Comment puis-je vous aider ?";
if(a(t,"merci","merci beaucoup","thanks"))return"Avec plaisir 😊. L'IMDS reste à votre disposition.";
if(a(t,"au revoir","a bientot","bye","bonne soiree"))return"Au revoir 👋 et merci pour votre intérêt pour l'IMDS.";
if(a(t,"qui es tu","qui etes vous","ton nom","votre nom"))return"Je suis le chatbot de l'Institution Mixte Le Domaine du Savoir (IMDS).";

if(a(t,"telephone","tel","portable","mobile")&&a(t,"classe","cours","en classe")&&a(t,"autorise","interdit","permis"))
return"Le téléphone est interdit en classe, sauf autorisation.";

if(a(t,"contact","contacts","telephone","tel","numero","whatsapp","joindre","contacter","coordonnees","appeler","appel","phone"))
return"Voici les contacts de l'IMDS :\n• "+KB.contacts.join("\n• ");

if(a(t,"nom de l'ecole","nom de votre ecole","comment s'appelle l'ecole"))return"L'école s'appelle "+KB.nom+".";
if(a(t,"devise","motto","slogan"))return"La devise de l'IMDS est : "+KB.devise;
if(a(t,"fondee","fondation","date de fondation","date de creation","quand l'ecole a ete fondee"))return"L'IMDS a été fondée le "+KB.fondation+".";
if(a(t,"adresse","ou se trouve","localisation","situe","emplacement","lieu","ou est l'ecole"))return"L'IMDS se trouve à "+KB.localisation;
if(a(t,"niveau","niveaux","classes","quelles classes","quels niveaux","cycles","scolarite"))return"L'IMDS accueille les élèves au "+KB.niveaux;

if(a(t,"document","documents","piece","pieces","papiers","dossier","necessaire")&&a(t,"inscription","inscrire","admission","inscrit"))
return"Documents nécessaires pour l'inscription :\n• "+KB.inscription.documents.join("\n• ");

if(a(t,"frais inscription","prix inscription","cout inscription","coût inscription","combien pour inscrire"))
return"Les frais d'inscription sont de "+KB.inscription.frais+".";
if(a(t,"horaire inscription","heures inscription","heure inscription","quand inscrire","bureau inscription"))
return"Les inscriptions se font "+KB.inscription.horaires+".";

if(a(t,"inscription","inscrire","admission","admissions","inscrit","inscrivez"))
return"Pour l'inscription :\n• Frais : "+KB.inscription.frais+"\n• Horaires : "+KB.inscription.horaires+"\n• Documents : acte de naissance, bulletin scolaire, 2 photos d'identité, CIN du responsable et carte de vaccination pour le Kindergarten.";

if(a(t,"frais","prix","cout","tarif","combien","ecolage","paiement","scolarite")){
if(a(t,"kindergarten","maternelle"))return"Les frais du Kindergarten sont de "+KB.frais.kindergarten+".";
if(a(t,"1re","1ere","premiere","2e","2eme","deuxieme","3e","3eme","troisieme","4e","4eme","quatrieme","5e","5eme","cinquieme","6e","6eme","sixieme"))return"Les frais de la 1re à la 6e année fondamentale sont de "+KB.frais["1re-6e"]+".";
if(a(t,"7e","7eme","septieme","8e","8eme","huitieme"))return"Les frais de la 7e à la 8e année fondamentale sont de "+KB.frais["7e-8e"]+".";
if(a(t,"9e","9eme","neuvieme"))return"Les frais de la 9e année fondamentale sont de "+KB.frais["9e"]+".";
return"Les frais scolaires sont :\n• Kindergarten : "+KB.frais.kindergarten+"\n• 1re–6e AF : "+KB.frais["1re-6e"]+"\n• 7e–8e AF : "+KB.frais["7e-8e"]+"\n• 9e AF : "+KB.frais["9e"]}

if(a(t,"horaire","horaires","heure","heures","cours","commence","termine","debut des cours","fin des cours")){
if(a(t,"kindergarten","maternelle"))return"Le Kindergarten fonctionne "+KB.horaires.kindergarten+".";
if(a(t,"1re","1ere","premiere","2e","2eme","3e","3eme","4e","4eme","5e","5eme","6e","6eme"))return"La 1re à la 6e année fondamentale fonctionne "+KB.horaires["1re-6e"]+".";
if(a(t,"7e","7eme","8e","8eme","9e","9eme"))return"La 7e à la 9e année fondamentale fonctionne "+KB.horaires["7e-9e"]+".";
return"Horaires des cours :\n• Kindergarten : 8h00–12h00\n• 1re–6e AF : 8h00–13h00\n• 7e–9e AF : 8h00–15h00\nDu lundi au vendredi.";
}

if(a(t,"uniforme","uniformes","tenue","tenues","habit","habits","vetement","dress code")){
if(a(t,"kindergarten","maternelle"))return"Kindergarten garçons : chemise jaune avec bordures vertes, short vert, ceinture noire, chaussures noires et chaussettes vertes.\n\nKindergarten filles : chemise jaune avec bordures vertes, robe chasuble verte plissée, chaussures noires, chaussettes vertes et nœuds verts.";
if(a(t,"1re","1ere","premiere","2e","2eme","3e","3eme","4e","4eme","5e","5eme","6e","6eme"))return"Pour la 1re–6e AF : garçons, chemise crème avec bordures vertes, short vert, ceinture noire, chaussures noires et chaussettes vertes. Filles, chemise crème avec bordures vertes, robe chasuble verte plissée, chaussures noires et chaussettes vertes.";
if(a(t,"7e","7eme","8e","8eme","9e","9eme"))return"Pour la 7e–9e AF : filles, chemise blanche avec bordures vertes, bande verte horizontale dans le dos, jupe plissée, chaussures noires et chaussettes blanches. Garçons, chemise blanche avec bordures vertes, bande verte horizontale dans le dos, pantalon vert long, ceinture noire, chaussures noires et chaussettes blanches.";
return"Uniformes de l'IMDS :\n• Kindergarten garçons : chemise jaune à bordures vertes, short vert, ceinture noire, chaussures noires, chaussettes vertes.\n• Kindergarten filles : chemise jaune à bordures vertes, robe chasuble verte plissée, chaussures noires, chaussettes vertes, nœuds verts.\n• 1re–6e garçons : chemise crème à bordures vertes, short vert, ceinture noire, chaussures noires, chaussettes vertes.\n• 1re–6e filles : chemise crème à bordures vertes, robe chasuble verte plissée, chaussures noires, chaussettes vertes.\n• 7e–9e filles : chemise blanche à bordures vertes, bande verte au dos, jupe plissée, chaussures noires, chaussettes blanches.\n• 7e–9e garçons : chemise blanche à bordures vertes, bande verte au dos, pantalon vert long, ceinture noire, chaussures noires, chaussettes blanches.";
}

if(a(t,"reglement","regles","discipline","comportement","interdit","obligatoire"))
return"Règlement intérieur de l'IMDS : respect de tous, ponctualité, assiduité, uniforme, interdiction des insultes, bagarres, menaces, harcèlement et violences, soin du matériel, propreté, téléphone interdit en classe sauf autorisation, respect des délais des devoirs, interdiction de tricher, interdiction de sortir sans autorisation, interdiction de dégrader les biens et interdiction des objets dangereux. Une mesure disciplinaire peut être prise et le responsable peut être informé.";

if(a(t,"regle de classe","regles de classe","classe","comportement en classe")&&a(t,"ecouter","main","interrompre","devoir","materiel","calme"))
return"Règles de classe : entrer calmement, saluer, s'installer avec son matériel, écouter, lever la main pour parler, ne pas interrompre, participer, ne pas déranger, ne pas copier, respecter le matériel, garder la classe propre, respecter les délais des devoirs, demander la permission pour sortir, respecter les différences et régler les conflits par le dialogue en informant l'enseignant.";

if(a(t,"directeur","directeurs","directrice","enseignant","enseignante","professeur","professeurs","personnel","equipe","staff","qui travaille"))
return"Personnel de l'IMDS :\n• "+KB.personnel.join("\n• ");

if(a(t,"eleves","élèves","eleves inscrits","élèves inscrits","enregistres","enregistrés","liste des eleves","noms des eleves"))
return"Élèves enregistrés :\n• "+KB.eleves.join("\n• ");

if(a(t,"promotion","promo")&&a(t,"9e","9eme","neuvieme","premiere","première"))
return"Première promotion de 9e AF :\n• "+KB.promotion9e.join("\n• ");

for(const nom of [...KB.eleves,...KB.promotion9e])if(t.includes(nom.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""))){
if(KB.eleves.includes(nom))return nom+" figure parmi les élèves enregistrés de l'IMDS.";
return nom+" figure parmi les élèves de la première promotion de 9e AF.";
}

if(a(t,"ecole","école","imds","etablissement","institution","domaine du savoir"))
return KB.nom+".\nDevise : "+KB.devise+"\nFondée le : "+KB.fondation+"\nLocalisation : "+KB.localisation+"\nNiveaux : "+KB.niveaux;

return"Je suis désolé, je n'ai pas cette information dans ma base de connaissances. Pour cette question, veuillez contacter l'administration de l'IMDS.";
}

function envoyerMessage(){
const input=document.getElementById("userInput"),message=input.value.trim();
if(!message)return;
ajouterMessage(message,"user");input.value="";
setTimeout(()=>ajouterMessage(repondre(message),"bot"),250);
}
document.getElementById("userInput").addEventListener("keydown",e=>{if(e.key==="Enter")envoyerMessage()});
</script>
</body>
</html>
