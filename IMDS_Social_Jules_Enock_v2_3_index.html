<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08783f"><title>IMDS Social Jules Enock</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f7f4;color:#173b2a}header{background:#08783f;color:#fff;padding:22px 15px;text-align:center}header h1{margin:0}main{max-width:620px;margin:18px auto;padding:0 14px}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:15px;box-shadow:0 3px 14px #0001}h2{color:#08783f;margin-top:0}label{display:block;font-weight:bold;margin:10px 0 5px}input,textarea{width:100%;padding:11px;border:1px solid #cbd8d0;border-radius:9px;font-size:16px}textarea{min-height:110px;resize:vertical}button{width:100%;padding:12px;border:0;border-radius:9px;margin-top:10px;font-weight:bold;font-size:15px}.p{background:#08783f;color:#fff}.g{background:#d5a526;color:#fff}.l{background:#e8f1eb;color:#08783f}.danger{background:#eee;color:#9b2226}.hidden{display:none}.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.nav button{margin:0;font-size:13px}.post{border-top:1px solid #e2e9e4;padding-top:14px;margin-top:14px}.meta{font-size:13px;color:#68786e}.actions{display:flex;gap:7px}.actions button{flex:1}.ok{color:#08783f;font-weight:bold}.err{color:#b3261e;font-weight:bold}
</style></head><body><header><h1>IMDS Social Jules Enock</h1><p>Institution Mixte Le Domaine du Savoir</p></header><main>

<section id="home" class="card"><h2>Bienvenue 👋</h2><p>Le réseau social privé de l'IMDS.</p><button class="p" onclick="show('login')">🔐 Se connecter</button><button class="g" onclick="show('register')">📝 Créer un compte</button></section>

<section id="register" class="card hidden"><h2>📝 Créer un compte</h2><div id="rm"></div>
<label>Type de compte</label><select id="role"><option>Direction</option><option>Professeur</option><option>Élève</option><option>Parent</option></select>
<label>Prénom</label><input id="first"><label>Nom</label><input id="last"><label>Téléphone</label><input id="phone"><label>Email</label><input id="email"><label>Mot de passe</label><input id="pass" type="password"><label>Confirmer</label><input id="pass2" type="password">
<button class="p" onclick="register()">Créer mon compte</button><button class="l" onclick="show('home')">Retour</button></section>

<section id="login" class="card hidden"><h2>🔐 Se connecter</h2><div id="lm"></div><label>Email ou téléphone</label><input id="lid"><label>Mot de passe</label><input id="lp" type="password"><button class="p" onclick="login()">Se connecter</button><button class="l" onclick="show('home')">Retour</button></section>

<section id="app" class="hidden">
<div class="card"><h2>🏫 IMDS Social</h2><div class="nav"><button class="p" onclick="tab('feed')">📰 Fil</button><button class="l" onclick="tab('profile')">👤 Profil</button><button class="l" onclick="logout()">🚪 Sortir</button></div></div>

<section id="feed" class="card"><h2>📰 Publications</h2><textarea id="postText" placeholder="Quoi de neuf à l'IMDS ?"></textarea><button class="p" onclick="publish()">📢 Publier</button><div id="posts"></div></section>

<section id="profile" class="card hidden"><h2>👤 Mon profil</h2><div id="pm"></div><label>Prénom</label><input id="pf"><label>Nom</label><input id="pl"><label>Téléphone</label><input id="pp"><label>Email</label><input id="pe"><label>Rôle</label><input id="pr" disabled><button class="p" onclick="saveProfile()">💾 Enregistrer les modifications</button></section>
</section></main>

<script>
const K="imdsUsers",S="imdsSession",P="imdsPosts";
function $(x){return document.getElementById(x)}function v(x){return $(x).value.trim()}
function show(id){["home","register","login","app"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function msg(id,t,c){$(id).innerHTML='<p class="'+c+'">'+t+"</p>"}
function register(){let u={role:v("role"),first:v("first"),last:v("last"),phone:v("phone"),email:v("email").toLowerCase(),password:v("pass")};if(!u.first||!u.last||!u.phone||!u.email||!u.password)return msg("rm","Remplissez tous les champs.","err");if(u.password!==v("pass2"))return msg("rm","Les mots de passe ne correspondent pas.","err");let a=JSON.parse(localStorage.getItem(K)||"[]");if(a.some(x=>x.email===u.email||x.phone===u.phone))return msg("rm","Email ou téléphone déjà utilisé.","err");a.push(u);localStorage.setItem(K,JSON.stringify(a));msg("rm","Compte créé avec succès.","ok");setTimeout(()=>show("login"),700)}
function login(){let id=v("lid").toLowerCase(),p=v("lp"),a=JSON.parse(localStorage.getItem(K)||"[]"),u=a.find(x=>(x.email===id||x.phone===id)&&x.password===p);if(!u)return msg("lm","Identifiants incorrects.","err");localStorage.setItem(S,JSON.stringify(u));openApp()}
function current(){return JSON.parse(localStorage.getItem(S)||"null")}
function openApp(){let u=current();if(!u)return show("home");show("app");loadProfile();renderPosts()}
function tab(t){$("feed").classList.toggle("hidden",t!=="feed");$("profile").classList.toggle("hidden",t!=="profile");if(t==="feed")renderPosts()}
function loadProfile(){let u=current();$("pf").value=u.first;$("pl").value=u.last;$("pp").value=u.phone;$("pe").value=u.email;$("pr").value=u.role}
function saveProfile(){let u=current(),a=JSON.parse(localStorage.getItem(K)||"[]"),i=a.findIndex(x=>x.email===u.email);if(i<0)return;let oldEmail=u.email;u.first=v("pf");u.last=v("pl");u.phone=v("pp");u.email=v("pe").toLowerCase();a[i]=u;localStorage.setItem(K,JSON.stringify(a));localStorage.setItem(S,JSON.stringify(u));msg("pm","Profil mis à jour.","ok")}
function publish(){let u=current(),text=v("postText");if(!text)return;let a=JSON.parse(localStorage.getItem(P)||"[]");a.unshift({id:Date.now(),author:u.first+" "+u.last,role:u.role,text,likes:0});localStorage.setItem(P,JSON.stringify(a));$("postText").value="";renderPosts()}
function like(id){let a=JSON.parse(localStorage.getItem(P)||"[]"),x=a.find(p=>p.id===id);if(x)x.likes++;localStorage.setItem(P,JSON.stringify(a));renderPosts()}
function removePost(id){let u=current(),a=JSON.parse(localStorage.getItem(P)||"[]"),x=a.find(p=>p.id===id);if(x&&x.author===u.first+" "+u.last){a=a.filter(p=>p.id!==id);localStorage.setItem(P,JSON.stringify(a));renderPosts()}}
function renderPosts(){let u=current(),a=JSON.parse(localStorage.getItem(P)||"[]");$("posts").innerHTML=a.length?a.map(p=>'<div class="post"><b>'+esc(p.author)+'</b> <span class="meta">• '+esc(p.role)+'</span><p>'+esc(p.text).replace(/\n/g,"<br>")+'</p><div class="actions"><button class="l" onclick="like('+p.id+')">❤️ '+p.likes+'</button>'+(p.author===u.first+" "+u.last?'<button class="danger" onclick="removePost('+p.id+')">🗑️ Supprimer</button>':"")+'</div></div>').join(""):"<p class='meta'>Aucune publication pour le moment.</p>"}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function logout(){localStorage.removeItem(S);show("home")}
if(current())openApp();
</script></body></html>
