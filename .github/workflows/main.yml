name: Construire APK IMDS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v6

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Décompresser le projet IMDS
        run: |
          mkdir project
          unzip -q IMDS_GITHUB_APK_COMPLET.zip -d project

      - name: Construire l'application
        run: |
          PROJECT_DIR="$(dirname "$(find project -name settings.gradle -print -quit)")"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: IMDS-Chatbot-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
